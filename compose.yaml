services:
  api:
    image: davidv410/todos-api
    env_file:
      - .env
    environment:
      - MONGODB_URI=mongodb://mongo:27017/todos
    depends_on:
      - mongo

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
      
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - api

volumes:
  mongo_data:
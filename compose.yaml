services:
  api:
    image: davidv410/todos-api
    ports:
      - "9000:9000"
    env_file:
      - .env
    environment:
      - MONGODB_URI=mongodb://mongo:27017/todos
    depends_on:
      - mongo

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data: